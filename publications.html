<!DOCTYPE html>
<html>
<head>
    <title>Publications - Davide Cusseddu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
            border-radius: 5px;
        }
        nav {
            margin: 20px 0;
            text-align: center;
        }
        nav a {
            margin: 0 15px;
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
        }
        .publication {
            background-color: #f9f9f9;
            padding: 15px;
            margin: 15px 0;
            border-left: 4px solid #333;
            border-radius: 5px;
        }
        .publication h3 {
            margin: 0 0 10px 0;
            color: #333;
        }
        .publication-meta {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }
        .publication-meta span {
            margin-right: 20px;
        }
        .publication p {
            margin: 10px 0;
            color: #555;
        }
        a.publication-link {
            color: #0066cc;
            text-decoration: none;
        }
        a.publication-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Davide Cusseddu</h1>
        <p>Publications</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="publications.html">Publications</a>
    </nav>

    <main>
        <h2>Publications</h2>
        <p>Add your publications here. Below is a template you can use:</p>

        <div class="publication">
            <h3>Publication Title</h3>
            <div class="publication-meta">
                <span><strong>Authors:</strong> Your Name, Co-Author</span>
                <span><strong>Year:</strong> 2024</span>
                <span><strong>Journal/Conference:</strong> Journal Name</span>
            </div>
            <p>Brief description or abstract of your publication.</p>
            <p>
                <a href="#" class="publication-link">Read Paper</a> | 
                <a href="#" class="publication-link">DOI</a>
            </p>
        </div>

        <!-- Add more publications below -->

    </main>
